<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RK3566 Dashboard</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial; }
  body { background:#070707; color:#e0e0e0; padding:20px; overflow-x:hidden; }
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:15px; border-bottom:1px solid #222; }
  .header h1 { color:#00ff88; font-size:22px; }
  .header .user { color:#aaa; font-size:14px; }
  .btn { padding:10px 18px; background:#00ff88; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer; text-decoration:none; }
  .btn-red { background:#ff4444; color:#fff; }

  .top{ display:flex; align-items:center; gap:15px; margin-bottom:20px; }
  .sideb { background:#1a1a1a; color:#00ff88; border:1px solid #333; padding:10px 16px; border-radius:8px; cursor:pointer; font-size:20px; }
  .search{ flex:1; max-width:300px; color:#00ff88; background:#111; font-size:1rem; height:44px; border-radius:12px; border:1px solid #333; padding:0 15px; outline:none; }
  .search:focus{ border-color:#00ff88; }

  /* FIXED NAV - LIQUID GLASS */
  nav{ 
    background: rgba(15,15,15,0.9);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    position: fixed; left:0; top:0; width:300px; height:100%;
    border-right:1px solid #222;
    transform: translateX(-100%);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index:100;
    padding:20px;
  }
  nav.open{ transform: translateX(0); }
  .topm{ display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
  .topm h1{ color:#00ff88; }
  .×{ background:transparent; border:none; color:#fff; font-size:32px; cursor:pointer; }
  .list{ display:flex; flex-direction:column; gap:10px; list-style:none; }
  .list a{ color:#aaa; text-decoration:none; font-size:18px; padding:12px 15px; border-radius:10px; background:#111; border:1px solid #222; transition:0.2s; display:block; }
  .list a:hover{ color:#00ff88; border-color:#00ff88; transform: translateX(5px); }

  /* Overlay */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); opacity:0; pointer-events:none; transition:0.3s; z-index:99; }
  .overlay.show{ opacity:1; pointer-events:all; }

  /* Grid */
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:20px; transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .grid.hide-all{ transform: scale(0.9); opacity:0; filter: blur(15px); pointer-events:none; height:0; overflow:hidden; }
  
  .card { background:#111; padding:20px; border-radius:16px; border:1px solid #222; transition:0.3s; }
  .card:hover { border-color:#00ff88; }
  .card h3 { color:#00ff88; margin-bottom:12px; font-size:14px; letter-spacing:1px; }
  .card .value { font-size:32px; font-weight:bold; margin-bottom:5px; }
  .card .label { color:#777; font-size:14px; }
  .progress { background:#222; border-radius:10px; height:10px; margin-top:10px; overflow:hidden; }
  .progress-bar { background:#00ff88; height:100%; border-radius:10px; transition:width 0.5s; }
  .gpio-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:15px; }
  .gpio-btn { padding:12px; border-radius:8px; border:1px solid #333; background:#1a1a1a; color:#fff; cursor:pointer; }
  .gpio-btn.on { background:#00ff88; color:#000; border-color:#00ff88; }
  canvas { background:#1a1a1a; border-radius:12px; width:100%; height:200px; margin-top:10px; }
  
  footer{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%); width:min(400px,90%); height:70px; background:rgba(20,20,20,0.8); backdrop-filter: blur(20px); border:1px solid #333; border-radius:100px; display:flex; justify-content:space-around; align-items:center; z-index:20 }
  footer button{ width:50px; height:50px; border-radius:100px; background:#111; color:#00ff88; font-size:20px; border:1px solid #333; cursor:pointer; transition:0.3s; }
  footer button:hover{ background:#00ff88; color:#000; transform:scale(1.1); }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>RK3566 CONTROL PANEL</h1>
    <p class="user">Welcome, {{ user }} | <span id="time"></span></p>
  </div>
  <div style="display:flex; gap:10px;">
    <button class="btn" id="hideAllBtn">🙈 Hide All</button>
    <a href="/logout" class="btn btn-red">LOGOUT</a>
  </div>
</div>

<div class="top">
  <button class="sideb" id="ham">☰</button>
  <input type="search" class="search" id="search" placeholder="🔎 search here (cpu, ram...)">
</div>

<div class="overlay" id="overlay"></div>

<nav id="menu">
  <div class="topm">
    <h1>Menu</h1>
    <button class="×" id="close">×</button>
  </div>
  <div class="list">
    <a href="#" data-filter="ram">💾 RAM</a>
    <a href="#" data-filter="system">🖥️ System</a>
    <a href="#" data-filter="gpu">🎮 GPU</a>
    <a href="#" data-filter="cpu">⚡ CPU</a>
    <a href="#" data-filter="rom">💿 ROM / Storage</a>
    <a href="#" data-filter="gpio">🔌 GPIO</a>
  </div>
</nav>

<div class="grid" id="grid">
  <div class="card" data-name="cpu">
    <h3>CPU USAGE</h3>
    <div class="value" id="cpu">0%</div>
    <div class="label">4 Cores @ 2.3GHz</div>
    <div class="progress"><div class="progress-bar" id="cpu-bar" style="width:0%"></div></div>
  </div>
  <div class="card" data-name="ram">
    <h3>RAM</h3>
    <div class="value" id="ram">0MB</div>
    <div class="label">of 2048MB</div>
    <div class="progress"><div class="progress-bar" id="ram-bar" style="width:0%"></div></div>
  </div>
  <div class="card" data-name="temp">
    <h3>BOARD TEMP</h3>
    <div class="value" id="temp">0°C</div>
    <div class="label">Normal: < 70°C</div>
  </div>
  <div class="card" data-name="rom storage disk">
    <h3>STORAGE</h3>
    <div class="value" id="disk">0GB</div>
    <div class="label">of 32GB eMMC</div>
    <div class="progress"><div class="progress-bar" id="disk-bar" style="width:0%"></div></div>
  </div>
  <div class="card" data-name="gpio">
    <h3>GPIO CONTROL</h3>
    <div class="gpio-grid">
      <button class="gpio-btn" onclick="toggleGPIO(17, this)">LED 1</button>
      <button class="gpio-btn" onclick="toggleGPIO(27, this)">LED 2</button>
      <button class="gpio-btn" onclick="toggleGPIO(22, this)">RELAY</button>
      <button class="gpio-btn" onclick="toggleGPIO(23, this)">FAN</button>
    </div>
  </div>
  <div class="card" style="grid-column: span 2;" data-name="cpu chart system">
    <h3>CPU USAGE - LAST 60s</h3>
    <canvas id="cpuChart"></canvas>
  </div>
</div>

<footer>
  <button>📈</button><button>🌡️</button><button>🧑‍🔧</button><button>🕦</button><button>🧭</button>
</footer>

<script>
  // Time
  function updateTime(){ document.getElementById('time').innerText = new Date().toLocaleTimeString(); }
  setInterval(updateTime, 1000); updateTime();

  // Hamburger Toggle - FIXED
  const ham = document.getElementById('ham');
  const menu = document.getElementById('menu');
  const close = document.getElementById('close');
  const overlay = document.getElementById('overlay');

  function openMenu(){ menu.classList.add('open'); overlay.classList.add('show'); }
  function closeMenu(){ menu.classList.remove('open'); overlay.classList.remove('show'); }

  ham.addEventListener('click', openMenu);
  close.addEventListener('click', closeMenu);
  overlay.addEventListener('click', closeMenu);

  // Hide All Features Button
  const hideBtn = document.getElementById('hideAllBtn');
  const grid = document.getElementById('grid');
  let hidden = false;
  hideBtn.addEventListener('click', () => {
    hidden = !hidden;
    grid.classList.toggle('hide-all', hidden);
    hideBtn.textContent = hidden ? '👁️ Show All' : '🙈 Hide All';
  });

  // Search Filter
  const search = document.getElementById('search');
  search.addEventListener('input', () => {
    const q = search.value.toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
      const name = card.dataset.name;
      card.style.display = name.includes(q) ? 'block' : 'none';
    });
  });

  // Menu links also filter
  document.querySelectorAll('.list a').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const filter = a.dataset.filter;
      search.value = filter;
      search.dispatchEvent(new Event('input'));
      closeMenu();
    });
  });

  // Fetch data
  async function fetchData() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      document.getElementById('cpu').innerText = data.cpu + '%';
      document.getElementById('cpu-bar').style.width = data.cpu + '%';
      document.getElementById('ram').innerText = data.ram_used + 'MB';
      document.getElementById('ram-bar').style.width = data.ram_percent + '%';
      document.getElementById('temp').innerText = data.temp + '°C';
      document.getElementById('disk').innerText = data.disk_used + 'GB';
      document.getElementById('disk-bar').style.width = data.disk_percent + '%';
    } catch(e){ console.log('API not connected - demo mode'); }
  }
  setInterval(fetchData, 2000); fetchData();

  async function toggleGPIO(pin, btn) {
    const res = await fetch(`/api/gpio/${pin}/toggle`, {method: 'POST'});
    const data = await res.json().catch(()=>({state: btn.classList.contains('on') ? 0 : 1}));
    if(data.state) btn.classList.add('on'); else btn.classList.remove('on');
  }
</script>
</body>
</html>
